[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pyxi-buddy"
version = "0.1.11"
description = "Pyxi: a playful desktop AI buddy that sees your screen, talks, points, sends agents to do real browser work, and explains things in 3D."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Marzuk Haider Chowdhury" }]
keywords = ["agents", "computer-use", "voice", "three.js", "electron", "langgraph", "playwright"]
dependencies = [
    # Otto is the browser-agent engine: https://github.com/marzukchowdhury/otto
    "otto-browser-buddy @ git+https://github.com/marzukchowdhury/otto.git",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "mss>=9.0",
    "pillow>=10.0",
    "numpy>=1.26",
    "uiautomation>=2.0; sys_platform == 'win32'",
    # Windows volume and "is it playing?" for music (Core Audio)
    "pycaw>=20240210; sys_platform == 'win32'",
    "kokoro-onnx>=0.4",
    "soundfile>=0.12",
    "faster-whisper>=1.0",
    "httpx>=0.27",
    # Pairing the browser extension: a key exchange, so no secret crosses the local socket
    "cryptography>=42",
    # Connected accounts and document fixing
    "google-auth-oauthlib>=1.2",
    "python-docx>=1.1",
    "pypdf>=4.0",
    # Pixel and Ledger: files and Office documents edited directly, no Office license needed
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "pypdfium2>=4.0",  # PDF pages to images
    "reportlab>=4.0",  # Word to PDF when LibreOffice isn't installed
    "pillow-heif>=0.18",  # iPhone photos (HEIC)
    # Reading scans when Windows' own OCR can't (no language pack); models ship in the package
    # and it runs on onnxruntime, which the voice stack already brings.
    "rapidocr-onnxruntime>=1.4",
    # Time zones on Windows (zoneinfo needs the IANA database)
    "tzdata>=2024.1",
    # Windows' built-in OCR: reads text inside images so Pyxi can underline it
    "winrt-runtime>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Local GPU voice with cloning and emotion tags (pulls PyTorch, several GB).
chatterbox = ["chatterbox-tts>=0.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6", "httpx>=0.27"]
# Speech-to-text on an NVIDIA GPU (about 10x faster than the CPU); about 2 GB of libraries.
gpu = ["nvidia-cublas-cu12>=12.4; sys_platform == 'win32'", "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32'"]

[project.scripts]
pyxi = "pyxi.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pyxi"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["browser: tests that launch a real Chromium instance"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF012", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"src/pyxi/cli.py" = ["B008"]
