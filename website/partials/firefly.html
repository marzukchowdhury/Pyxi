<!-- Pyxi's presence, the same firefly as the app: a dark body that reads on light pages and a glowing tail. -->
<div class="lantern" aria-hidden="true"></div>
<svg class="tether" aria-hidden="true" width="100%" height="100%">
  <defs>
    <linearGradient id="thread-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3cf" stop-opacity="0.95" />
      <stop offset="1" stop-color="#ffc861" stop-opacity="0.95" />
    </linearGradient>
  </defs>
  <g class="ff-trail"></g>
  <path class="thread-line" d="" />
  <circle class="thread-spark" r="2.6" />
  <g class="target">
    <circle class="ring-wave" r="9" />
    <circle class="ring-wave late" r="9" />
    <circle class="ring-core" r="9" />
  </g>
</svg>
<div class="target-tag" aria-hidden="true"></div>
<div class="presence mode-idle" aria-hidden="true">
  <svg class="presence-svg" width="60" height="60" viewBox="-24 -24 48 48">
    <defs>
      <radialGradient id="ff-tail" cx="0.45" cy="0.4" r="0.65">
        <stop offset="0" stop-color="#fffbea" />
        <stop offset="0.55" stop-color="#ffe08a" />
        <stop offset="1" stop-color="#ffb02e" />
      </radialGradient>
      <radialGradient id="ff-halo">
        <stop offset="0" stop-color="#ffe08a" stop-opacity="0.55" />
        <stop offset="0.45" stop-color="#ffc861" stop-opacity="0.2" />
        <stop offset="1" stop-color="#ffc861" stop-opacity="0" />
      </radialGradient>
    </defs>
    <circle class="presence-ring" r="13" />
    <circle class="ff-halo" r="12" fill="url(#ff-halo)" />
    <g class="ff-bug" transform="rotate(-30)">
      <path class="ff-feeler" d="M-0.7 -9.2 Q-1.6 -11.6 -3.4 -12.6 M0.7 -9.2 Q1.6 -11.6 3.4 -12.6" />
      <g transform="rotate(-38 -2.4 -5)"><ellipse class="ff-wing" cx="-2.4" cy="-5" rx="3.8" ry="1.7" /></g>
      <g transform="rotate(38 2.4 -5)"><ellipse class="ff-wing" cx="2.4" cy="-5" rx="3.8" ry="1.7" /></g>
      <ellipse class="ff-body" cx="0" cy="-5" rx="2.3" ry="2.6" />
      <circle class="ff-body" cx="0" cy="-8.3" r="1.6" />
      <ellipse class="ff-core" cx="0" cy="0" rx="3" ry="3.7" />
    </g>
  </svg>
</div>
