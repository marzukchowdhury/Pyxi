<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pyxi social preview</title>
    <style>
      @font-face { font-family: "Inter Variable"; src: url("../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
      html, body { margin: 0; }
      body { width: 1200px; height: 630px; overflow: hidden; position: relative; color: #f4f7fb; font-family: "Inter Variable", sans-serif; -webkit-font-smoothing: antialiased;
        background: radial-gradient(800px 500px at 82% 20%, rgba(158, 203, 255, 0.12), transparent 60%), radial-gradient(700px 500px at 0% 100%, rgba(255, 200, 97, 0.1), transparent 60%), #07080b; }
      body::before { content: ""; position: absolute; inset: 0; background: radial-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1.3px) 0 0 / 22px 22px; }
      .copy { position: absolute; left: 72px; top: 92px; width: 560px; }
      .chip { display: inline-block; padding: 5px 14px 6px; border-radius: 99px; font-size: 19px; font-weight: 650; color: #ffd98c; background: rgba(255, 200, 97, 0.12); border: 1px solid rgba(255, 200, 97, 0.3); }
      h1 { margin: 34px 0 0; font-size: 132px; font-weight: 690; line-height: 0.95; letter-spacing: -0.05em; }
      .i { position: relative; display: inline-block; }
      .dot { position: absolute; left: calc(50% + 0.024em); top: 0.08em; width: 0.17em; height: 0.17em; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(circle at 45% 40%, #fffbea, #ffe08a 55%, #ffb02e); box-shadow: 0 0 0 1.5px rgba(40, 24, 0, 0.6), 0 0 26px rgba(255, 200, 97, 0.95), 0 0 70px rgba(255, 190, 80, 0.5); }
      p { margin: 26px 0 0; font-size: 31px; line-height: 1.32; font-weight: 500; letter-spacing: -0.02em; color: rgba(232, 238, 248, 0.72); }
      p b { color: #9ecbff; font-weight: 600; }
      .screen { position: absolute; left: 640px; top: 118px; width: 640px; border-radius: 22px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.16); box-shadow: 0 0 0 8px rgba(255, 255, 255, 0.03), 0 40px 120px rgba(0, 0, 0, 0.7); transform: perspective(1600px) rotateY(-12deg) rotateX(4deg); transform-origin: 0 50%; }
      .screen img { display: block; width: 100%; }
      .foot { position: absolute; left: 72px; bottom: 54px; display: flex; align-items: center; gap: 14px; font-size: 22px; font-weight: 600; color: rgba(232, 238, 248, 0.55); }
      .foot img { width: 40px; height: 40px; border-radius: 10px; }
    </style>
  </head>
  <body>
    <div class="screen"><img src="../public/img/targeting.webp" alt="" /></div>
    <div class="copy">
      <span class="chip">Beta for Windows</span>
      <h1>Hey Pyx<span class="i">&#305;<span class="dot"></span></span></h1>
      <p>A little firefly on your desktop that <b>points, draws</b> and <b>explains in 3D</b>, and clicks when you let it.</p>
    </div>
    <div class="foot"><img src="../public/icon-192.png" alt="" />Pyxi</div>
  </body>
</html>
